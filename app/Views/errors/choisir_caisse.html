<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choisir caisse</title>
</head>
<body>
    <h1>Choisir une caisse</h1>
    <form action="/choisir_caisse" method="post">
        <label for="caisse">Sélectionnez une caisse :</label>
        <select name="caisse" id="caisse">
            <option value="caisse1">Caisse 1</option>
            <option value="caisse2">Caisse 2</option>
            <option value="caisse3">Caisse 3</option>
        </select>
        <button type="submit">Valider</button>
    </form>
</body>
</html>
